services:
  database:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME}
      POSTGRES_USER: ${DB_USER:?Define DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - private

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME}
      DB_USER: ${DB_USER:?Define DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD}
      SERVER_SERVLET_SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:?Define SESSION_COOKIE_NAME}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - private

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Define SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks:
      - private
      # Shared only with XPANDER's public containers (xpander-web, xpander-api).
      - xpander_edge

networks:
  private:
  xpander_edge:
    external: true
    name: xpander_edge

volumes:
  database_data:
  caddy_data:
  caddy_config:
