name: cabello_test

services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env.test}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env.test}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.test}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cabello_postgres_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env.test}
      DB_USER: ${DB_USER:?Define DB_USER en .env.test}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.test}
      SERVER_SERVLET_SESSION_COOKIE_NAME: CABELLO_TEST_SESSION
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  cabello_postgres_test:
