services:
  database:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${DB_NAME:?Define DB_NAME en .env.local}
      POSTGRES_USER: ${DB_USER:?Define DB_USER en .env.local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - cabello_postgres_local:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Define DB_NAME en .env.local}
      DB_USER: ${DB_USER:?Define DB_USER en .env.local}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env.local}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  cabello_postgres_local:
